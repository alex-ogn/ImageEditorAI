[project]
name = "image-editor-ai"
version = "0.1.0"
description = "Cross-platform desktop app for creative and interactive AI features over images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.gui-scripts]
image-editor-ai = "image_editor_ai.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_editor_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
